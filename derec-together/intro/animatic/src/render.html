<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/local.css">
<style>body{margin:0}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="audio.js"></script><script src="draw.js"></script><script src="timeline.js"></script>
<script>
const FONTS = { display: "'Fraunces', Georgia, serif", text: "'Atkinson Hyperlegible Next', system-ui, sans-serif" };
const ctx = document.getElementById('c').getContext('2d');
window.frame = (f) => { MHTimeline.render(ctx, f, FONTS); return document.getElementById('c').toDataURL('image/png'); };
window.renderAudio = async () => {
  const secs = (MHTimeline.END + MHTimeline.TAIL) / MHTimeline.FPS + 0.5, sr = 48000;
  const oac = new OfflineAudioContext(2, Math.ceil(secs * sr), sr);
  const eng = new MHAudio.Engine(oac, oac.destination);
  MHTimeline.schedule(eng, 0.0);
  const buf = await oac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, sum = 0; for (let i = 0; i < L.length; i++) { peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); sum += L[i] * L[i]; }
  // 16-bit WAV
  const n = L.length, ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 4, true);
  const g = peak > 0.98 ? 0.98 / peak : 1;
  for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * g)) * 32767, true); v.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * g)) * 32767, true); }
  let bin = ''; const bytes = new Uint8Array(ab); for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { b64: btoa(bin), peak: peak, rms: Math.sqrt(sum / n) };
};
</script></body></html>
